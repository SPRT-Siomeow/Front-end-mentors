<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <div class="container">
    <div class="card">
      <img src="assets\images\illustration-article.svg" alt="image" class="card-img">
      <div class="text">
        <h5>Learning</h5>
        <p class="date">Published 21 Dec 2023</p>
        <h3>HTML & CSS foundations</h3>
        <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="author">
        <img src="assets\images\image-avatar.webp" alt="logo-img" width="30px">
        <h5 class="name"> Greg Hooper</p>
      </div>
    </div>
  </div>
  <div class="attribution">
    <p>Challenge by 
      <a href="https://www.frontendmentor.io?ref=challenge" 
        target="_blank">Frontend Mentor
      </a>.
    </p>
    <p>Coded by <a href="#">Siomeow</a>.</p>
  </div>

</body>
</html>
